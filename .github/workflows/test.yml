name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run guard.sh tests
        run: bash tests/test_guard.sh

  # Windows smoke job (#29). The full test suite assumes Unix-only
  # paths (/etc, /tmp, symlink fixtures requiring admin) which the
  # GHA Windows runner doesn't satisfy — fixturizing them is tracked
  # in #30. Until then we run a minimal smoke test that exercises
  # the cygpath conversion path (#28) and the bash --version FP fix
  # (#33), so a regression in either is caught on real MSYS2.
  windows-smoke:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: jq
      - name: Run Windows smoke tests
        run: bash tests/test_windows_smoke.sh
